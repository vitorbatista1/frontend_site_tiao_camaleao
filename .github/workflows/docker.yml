name: Build and Push to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"  # dispara quando criar uma tag ex: v1.0.0

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}         # v1.0.0
            type=semver,pattern={{major}}.{{minor}}  # v1.0
            type=raw,value=latest                   # latest

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PUBLIC_MP_PUBLIC_KEY=${{ secrets.PUBLIC_MP_PUBLIC_KEY }}
            PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}

      - name: Criar GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true